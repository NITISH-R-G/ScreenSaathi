# AGP 9 needs JDK 17+. If the JDK on your PATH is older (this project's Windows
# box has 8), pin the daemon in your USER-level ~/.gradle/gradle.properties:
#
#     org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
#
# It belongs there, not here — a hardcoded absolute path in a committed file
# breaks every other machine, and it broke Linux CI on the first run.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
